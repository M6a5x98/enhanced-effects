name: Build, Release to Modrinth, and Create GitHub Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          # Fetch full history for generating a proper diff
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Extract Version from gradle.properties
        id: extract_version
        run: |
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "Extracted mod_version: ${MOD_VERSION}"
          echo "MOD_VERSION=${MOD_VERSION}" >> $GITHUB_ENV

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get Previous Commit
        id: prev_commit
        run: |
          # Attempt to retrieve the previous commit; if not found, fallback to HEAD
          PREV_COMMIT=$(git rev-parse HEAD^ 2>/dev/null || echo "HEAD")
          echo "PREV_COMMIT=${PREV_COMMIT}" >> $GITHUB_ENV

      - name: Release to Modrinth
        uses: dsx137/modrinth-releaser@main
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_KEY }}
        with:
          name: "Enhanced Effects"
          project_id: ${{ secrets.MODRINTH_PROJECT_ID }}
          loaders: fabric
          game_versions: "1.20.1"
          version_number: ${{ env.MOD_VERSION }}
          files: ./build/libs/*.jar
          changelog: |
            Automated build release for version ${{ env.MOD_VERSION }} triggered manually on commit ${{ github.sha }}
            Full changelog: https://github.com/M6a5x98/enhanced-effects/compare/${{ env.PREV_COMMIT }}...${{ github.sha }}

      - name: Create GitHub Release with gh-release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: "v${{ env.MOD_VERSION }}"
          name: "Release ${{ env.MOD_VERSION }}"
          body: |
            Automated GitHub release for version ${{ env.MOD_VERSION }} triggered manually on commit ${{ github.sha }}.
            
            View changes [here](https://github.com/M6a5x98/enhanced-effects/compare/${{ env.LATEST_TAG }}...${{ github.sha }}).
          draft: "false"
          prerelease: "false"
